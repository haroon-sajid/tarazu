<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Profile · Tarazu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #edf1f7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .dashboard {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0, 20, 30, 0.08);
            padding: 24px 22px 22px;
        }

        /* === PAGE TITLE === */
        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #0e1f33;
            letter-spacing: -0.3px;
            margin-bottom: 20px;
        }

        /* === HEADER WITH AVATAR, NAME, EMAIL, BUTTONS === */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            background: #e7edf8;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 22px;
            color: #1d2b44;
            flex-shrink: 0;
        }

        .profile-meta {
            flex: 1;
            min-width: 0;
        }

        .profile-meta .role {
            font-size: 18px;
            font-weight: 600;
            color: #0e1f33;
            letter-spacing: -0.2px;
        }

        .profile-meta .email {
            font-size: 14px;
            font-weight: 400;
            color: #6a7f9b;
            margin-top: 2px;
            letter-spacing: -0.1px;
            word-break: break-all;
        }

        /* === EDIT & SIGN OUT BUTTONS === */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-edit,
        .btn-signout {
            background: #f0f4fc;
            border: 1px solid #e2eaf5;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #1d3b5a;
            cursor: default;
            transition: background 0.1s ease;
            letter-spacing: -0.1px;
            white-space: nowrap;
        }

        .btn-signout {
            background: #feeceb;
            border-color: #fadcd9;
            color: #b33a34;
        }

        .btn-edit:hover {
            background: #e5edf9;
        }

        .btn-signout:hover {
            background: #fcdeda;
        }

        /* === STATS GRID === */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 16px 0 12px;
        }

        .stat-card {
            background: #f8faff;
            border-radius: 20px;
            padding: 18px 14px 14px;
            border: 1px solid #eaf0f8;
        }

        .stat-card .stat-label {
            font-size: 13px;
            font-weight: 500;
            color: #5d748f;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 34px;
            font-weight: 700;
            color: #0e1f33;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .stat-card .stat-sub {
            font-size: 12px;
            font-weight: 400;
            color: #6a7f9b;
            margin-top: 8px;
            border-top: 1px solid #eaf0f8;
            padding-top: 8px;
        }

        /* === FOOTER === */
        .meta-footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid #eef3fa;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meta-footer .timestamp {
            font-size: 13px;
            color: #6a7f9b;
        }

        .meta-footer .badge {
            background: #eaf0f8;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #1d3b5a;
        }

        /* === SUMMARY LINE === */
        .summary-line {
            margin-top: 14px;
            display: flex;
            justify-content: flex-start;
            gap: 16px;
            font-size: 12px;
            color: #6a7f9b;
            padding: 10px 0 0;
            border-top: 1px solid #eef3fa;
            flex-wrap: wrap;
        }

        .summary-line span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .summary-line .dot {
            width: 6px;
            height: 6px;
            background: #9ab0cc;
            border-radius: 10px;
            display: inline-block;
        }

        /* === RESPONSIVE === */
        @media (max-width: 400px) {
            .dashboard {
                padding: 18px 14px 18px;
            }
            .profile-header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }
            .btn-edit,
            .btn-signout {
                padding: 5px 14px;
                font-size: 12px;
            }
            .stat-card .stat-value {
                font-size: 28px;
            }
            .page-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <!-- === PROFILE INFORMATION HEADING === -->
        <div class="page-title">Profile Information</div>

        <!-- === PROFILE HEADER === -->
        <div class="profile-header">
            <div class="avatar">A</div>
            <div class="profile-meta">
                <div class="role">Auditor</div>
                <div class="email">auditor@tarazu.local</div>
            </div>
            <div class="header-actions">
                <span class="btn-edit">✎ Edit</span>
                <span class="btn-signout">✕ Sign out</span>
            </div>
        </div>

        <!-- === STATS === -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Decisions made</div>
                <div class="stat-value">2</div>
                <div class="stat-sub">this month</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Awaiting you</div>
                <div class="stat-value">8</div>
                <div class="stat-sub">pending review</div>
            </div>
        </div>

        <!-- === FOOTER === -->
        <div class="meta-footer">
            <div class="timestamp">updated today</div>
            <div class="badge">Profile</div>
        </div>

        <!-- === SUMMARY === -->
        <div class="summary-line">
            <span><span class="dot"></span> 2 decisions · 8 awaiting</span>
            <span>📌 tarazu.local</span>
        </div>
    </div>
</body>
</html>
